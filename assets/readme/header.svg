<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Priyangshu Dey: Building AI that ships. Founder and CEO of AakaarIO, AI engineer, full-stack developer.">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#e6e6e6"/></pattern>
    <radialGradient id="gO" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff8a4c" stop-opacity=".55"/><stop offset="1" stop-color="#ff6b2c" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#c9d6ff" stop-opacity=".9"/><stop offset="1" stop-color="#1f4fff" stop-opacity="0"/></radialGradient>
    <pattern id="hat" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V9" stroke="#1f4fff" stroke-width="1.2" opacity=".16"/></pattern>
    <clipPath id="card"><rect x="8" y="8" width="1258" height="378" rx="24"/></clipPath>
    <clipPath id="circ"><path d="M1040 52 C1131 49 1190 113 1188 204 C1186 292 1125 352 1038 350 C950 348 891 290 893 200 C895 112 952 54 1040 52Z"/></clipPath>
    <clipPath id="type"><rect x="70" y="236" height="50" width="540"><animate attributeName="width" values="0;0;540;540;0" keyTimes="0;.08;.42;.9;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <style>
      .sans { font-family: Inter, "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", Consolas, "SF Mono", Menlo, "Courier New", monospace; }
      .swash { stroke-dasharray: 620; stroke-dashoffset: 0; animation: draw 9s ease-in-out infinite; }
      @keyframes draw { 0%, 4% { stroke-dashoffset: 620; } 18%, 92% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -620; } }
      .spark { transform-box: fill-box; transform-origin: center; animation: spin 7s linear infinite, pulse 2.2s ease-in-out infinite; }
      @keyframes spin { to { rotate: 360deg; } } @keyframes pulse { 50% { scale: 1.18; } }
      .dot { animation: ping 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes ping { 0% { scale: 1; opacity: .5; } 100% { scale: 2.6; opacity: 0; } }
      .caret { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
      .role { opacity: 0; animation: role 9s infinite; } .r1 { opacity: 1; } .r2 { animation-delay: 3s; } .r3 { animation-delay: 6s; }
      @keyframes role { 0% { opacity: 0; translate: 0 6px; } 4%, 30% { opacity: 1; translate: 0 0; } 34%, 100% { opacity: 0; translate: 0 -6px; } }
      .float { animation: float 5s ease-in-out infinite; } @keyframes float { 50% { translate: 0 -6px; } }
    </style>
  </defs>
  <!-- card with an ink shadow -->
  <rect x="16" y="16" width="1258" height="378" rx="24" fill="#111"/>
  <g clip-path="url(#card)">
    <rect x="8" y="8" width="1258" height="378" fill="#fff"/>
    <rect x="8" y="8" width="1258" height="378" fill="url(#dots)"/>
    <ellipse cx="780" cy="430" rx="520" ry="170" fill="url(#gO)"/>
    <ellipse cx="80" cy="440" rx="320" ry="120" fill="url(#gO)" opacity=".6"/>
    <ellipse cx="1210" cy="20" rx="300" ry="190" fill="url(#gB)"/>
  </g>
  <rect x="8" y="8" width="1258" height="378" rx="24" fill="none" stroke="#111" stroke-width="2"/>

  <!-- status pill -->
  <g class="mono" font-size="15">
    <rect x="70" y="48" width="296" height="34" rx="17" fill="#fff" stroke="#e3e3e3" stroke-width="1.5"/>
    <circle class="dot" cx="90" cy="65" r="5" fill="#22a35a"/><circle cx="90" cy="65" r="5" fill="#22a35a"/>
    <text x="104" y="70" fill="#555">open to internships &amp; collabs</text>
  </g>
  <!-- name -->
  <text class="sans" x="66" y="160" font-size="86" font-weight="800" letter-spacing="-3.5" fill="#1f4fff">Priyangshu <tspan font-weight="300">Dey</tspan></text>
  <path class="swash" d="M72 184 C150 174 260 175 340 180 S470 188 560 178" fill="none" stroke="#ff6b2c" stroke-width="4" stroke-linecap="round"/>
  <!-- tagline, typed -->
  <g clip-path="url(#type)"><text class="sans" x="70" y="272" font-size="38" font-weight="600" letter-spacing="-1" fill="#1b1b1b">Building <tspan fill="#c2410c">AI that ships</tspan>.</text></g>
  <rect class="caret" x="70" y="240" width="3" height="40" fill="#1f4fff"><animate attributeName="x" values="70;70;590;590;70" keyTimes="0;.08;.42;.9;1" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.3 0 .7 1;0 0 1 1;.3 0 .7 1"/></rect>
  <!-- rotating roles -->
  <g class="mono" font-size="20">
    <text class="role r1" x="70" y="330"><tspan fill="#ff6b2c" font-weight="700">Founder &amp; CEO</tspan><tspan fill="#8a8a8a"> · AakaarIO · idea → production</tspan></text>
    <text class="role r2" x="70" y="330"><tspan fill="#1f4fff" font-weight="700">AI Engineer</tspan><tspan fill="#8a8a8a"> · agents · RAG · evals</tspan></text>
    <text class="role r3" x="70" y="330"><tspan fill="#111" font-weight="700">Full-Stack Developer</tspan><tspan fill="#8a8a8a"> · React → FastAPI → AWS</tspan></text>
  </g>

  <!-- dashed trail from the pen to the words -->
  <path id="trail" d="M890 250 C820 300 760 320 690 300" fill="none" stroke="#1f4fff" stroke-width="1.6" stroke-dasharray="4 6" opacity=".55"/>
  <circle r="5" fill="#1f4fff"><animateMotion dur="3.2s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#trail"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="3.2s" repeatCount="indefinite"/></circle>

  <!-- the speaker, in a hand-drawn circle -->
  <g class="float">
    <path d="M1040 52 C1131 49 1190 113 1188 204 C1186 292 1125 352 1038 350 C950 348 891 290 893 200 C895 112 952 54 1040 52Z" fill="#fff"/>
    <path d="M1040 52 C1131 49 1190 113 1188 204 C1186 292 1125 352 1038 350 C950 348 891 290 893 200 C895 112 952 54 1040 52Z" fill="url(#hat)"/>
    <g clip-path="url(#circ)">
      <g transform="translate(82.4 -21.5) scale(1.33)" stroke="#111" stroke-linecap="round" stroke-linejoin="round" fill="#fff">
        <path d="M624 300 C626 214 666 186 720 184 C774 186 814 214 816 300Z" fill="#111" stroke-width="2"/>
        <path d="M703 186 L708 300 H732 L737 186 C731 184 726 183.5 720 183.5 C714 183.5 709 184 703 186Z" stroke-width="1.6"/>
        <path d="M706.5 188.5 Q720 198 733.5 188.5" fill="none" stroke-width="1.8"/>
        <path d="M703 186 L689 205 L706 213 L711 196Z M737 186 L751 205 L734 213 L729 196Z" fill="#111" stroke="#fff" stroke-width="1.5"/>
        <path d="M745 228 H760" stroke="#fff" stroke-width="1.3"/><path d="M751 228 V217" stroke="#ff6b2c" stroke-width="2.6"/>
        <path d="M707 160 C708 170 707.5 178 705.5 186 C712 192 728 192 734.5 186 C732.5 178 732 170 733 160" stroke-width="1.8"/>
        <g transform="translate(0 8)">
          <path d="M702 121 C694 117 689.5 123 690.5 130 C691.5 138 697 142 702.5 140" stroke-width="2"/>
          <circle cx="696.5" cy="141.5" r="1.8" fill="#111" stroke="none"/>
          <path d="M738 121 C746 117 750.5 123 749.5 130 C748.5 138 743 142 737.5 140" stroke-width="2"/>
          <path d="M701 110 C701 99 709 93 720 93 C731 93 739 99 739 110 L739 140 C739 155 731 165 720 165 C709 165 701 155 701 140Z" stroke-width="2.2"/>
          <path d="M700 108 C696 99 697 90 703 86 C700 80 705 75 711 77 C713 71 721 69 726 73 C731 68 741 71 742 78 C749 79 752 86 748 92 C752 97 750 104 744 107 C742 103 738 99 732 98 C724 96 715 97 708 100 C704 102 701.5 105 700 108Z" fill="#111" stroke-width="1.6"/>
          <path d="M703.5 89 C706 85 711 84.5 714 87.5 M715 79 C719 75.5 725 76 727 80 M729 76 C734 74.5 739 77 739.5 82 M740 86 C744 86 747 89 746.5 93 M710 93.5 C715 90.5 722 90 727 92.5" fill="none" stroke="#fff" stroke-width="1.4"/>
          <path d="M704.5 116.5 C707.5 112.5 714 111.6 718.6 114 L717.6 117 C713.4 115.4 708.8 116 705.6 118.6Z M735.5 116.5 C732.5 112.5 726 111.6 721.4 114 L722.4 117 C726.6 115.4 731.2 116 734.4 118.6Z" fill="#111" stroke-width="1"/>
          <ellipse cx="711.5" cy="124.5" rx="2.8" ry="2.8" fill="#111" stroke="none"><animate attributeName="ry" values="2.8;2.8;.3;2.8;2.8" keyTimes="0;.9;.94;.98;1" dur="4.2s" repeatCount="indefinite"/></ellipse>
          <ellipse cx="729.5" cy="124.5" rx="2.8" ry="2.8" fill="#111" stroke="none"><animate attributeName="ry" values="2.8;2.8;.3;2.8;2.8" keyTimes="0;.9;.94;.98;1" dur="4.2s" repeatCount="indefinite"/></ellipse>
          <path d="M721 126 C720.6 131 718.6 135.6 718.4 138.2 C719.4 139.8 721.6 139.8 723 138.6" fill="none" stroke-width="1.6"/>
          <path d="M701.5 134 C702.5 149 708 160 720 166 C732 160 737.5 149 738.5 134 C737 140 733.5 145 728.5 146.6 C725 143.6 715 143.6 711.5 146.6 C706.5 145 703 140 701.5 134Z" fill="#111" stroke-width="1.4"/>
          <path d="M710 144.6 C713.5 140.6 718 140.6 720 142.4 C722 140.6 726.5 140.6 730 144.6 C726 145.4 722.6 146.6 720 146.6 C717.4 146.6 714 145.4 710 144.6Z" fill="#111" stroke-width="1"/>
          <path d="M714.6 148.6 Q720 152.6 725.4 148.6" fill="none" stroke="#fff" stroke-width="1.7"/>
        </g>
      </g>
    </g>
    <path d="M1040 52 C1131 49 1190 113 1188 204 C1186 292 1125 352 1038 350 C950 348 891 290 893 200 C895 112 952 54 1040 52Z" fill="none" stroke="#1f4fff" stroke-width="3"/>
  </g>
  <path class="spark" d="M1196 44 C1198 62 1204 68 1222 70 C1204 72 1198 78 1196 96 C1194 78 1188 72 1170 70 C1188 68 1194 62 1196 44Z" fill="#ff6b2c"/>
  <path class="spark" d="M876 66 C877 74 880 77 888 78 C880 79 877 82 876 90 C875 82 872 79 864 78 C872 77 875 74 876 66Z" fill="#1f4fff" style="animation-duration: 9s, 3s"/>
</svg>
